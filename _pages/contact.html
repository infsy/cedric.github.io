---
lang: fr
layout: page
title: Contact
description: Si vous désirez me contacter, vous pouvez me laisser un message via ce formulaire
permalink: /contact/
image: '/images/covers/facteur.jpeg'
image_caption: 'Photo generated by Gemini'
---

<div class="form-box">
  <form class="form" action="https://formspree.io/f/{% if site.data.settings.contact.formspree_form_id %}{{ site.data.settings.contact.formspree_form_id | escape }}{% else %}{{ site.data.settings.contact.email | escape }}{% endif %}" method="POST">
    <div class="form__group">
      <label class="form__label screen-reader-text" for="form-name">Votre nom</label>
      <input class="form__input" id="form-name" type="text" name="name" placeholder="Nom" required>
    </div>
    <div class="form__group">
      <label class="form__label screen-reader-text" for="form-email">Votre courriel</label>
      <input class="form__input" id="form-email" type="email" name="email" placeholder="Courriel" required>
    </div>
    <div class="form__group">
      <label class="form__label screen-reader-text" for="form-text">Votre message</label>
      <textarea class="form__input" id="form-text" name="message" rows="7" placeholder="Message" required></textarea>
    </div>
    <div class="form__group">
      <button class="button button--primary" type="submit">Envoyer le message</button>
    </div>
  </form>
</div>
